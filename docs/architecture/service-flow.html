<script id="flow-data" type="application/json">[{"en": ["01 · Startup and configuration", "Configuration is composed at process startup. Python Core starts concurrent samplers, market-feature and shock runners, plus configuration-gated tasks. A service definition or code path does not prove a task is enabled.", "Runtime control files and explicit reload paths have their own readers; there is no implied global live configuration reload."], "zh": ["01 · 启动与配置", "配置在进程启动时组合。Python Core 并发启动采样、市场特征、shock runner 及受开关控制的任务。存在服务定义或代码路径不代表已经启用。", "运行控制文件和显式重载各有读取方，不存在隐含的全局配置热更新。"], "sources": ["src/spx_spark/core_main.py", "src/spx_spark/app_settings.py", "src/spx_spark/settings/loader.py"]}, {"en": ["02 · Collectors and normalized observations", "Schwab and IBKR own their broker sessions, contracts, quotas, and field clocks. Provider snapshots become normalized quotes before persistence. Exact-leg demand and subscription acknowledgements are not proof of fresh executable quotes.", "persist_provider_snapshot appends raw quotes before updating latest state. The raw history and latest projection are separate writes, not one cross-store transaction."], "zh": ["02 · 采集器与标准化观测", "Schwab 和 IBKR 各自负责券商会话、合约、配额与字段时钟。Provider 快照先转换为标准报价再持久化。Exact-leg 需求或订阅确认不代表执行报价已经新鲜。", "persist_provider_snapshot 先追加 raw 行情，再更新 latest。原始历史与最新投影是独立写入，不是跨存储事务。"], "sources": ["src/spx_spark/provider_adapter.py", "src/spx_spark/marketdata.py", "src/spx_spark/storage.py"]}, {"en": ["03 · Features and parallel analysis", "The market-feature runner reads normalized state and builds market/option evidence. The shock runner has its own loop and projected state; samplers run concurrently. These are not successive stages in one broker-to-notification loop.", "Optional context and research projections are advisory. Some research can run in real time; the weekend historical workload is separately isolated on the home laptop."], "zh": ["03 · 特征与并行分析", "市场特征 runner 读取标准状态，构建市场与期权证据。Shock runner 有独立循环和状态投影，采样任务同时运行，并非单个“券商到通知”大循环中的串行步骤。", "可选背景和研究投影只提供参考；部分研究可实时运行，周末历史计算则单独放在家庭笔记本。"], "sources": ["src/spx_spark/core_main.py", "src/spx_spark/application/market_features/service.py", "src/spx_spark/application/shock/service.py"]}, {"en": ["04 · Candidate authorization and commit", "build_strategy_decision combines facts and regime evidence, constructs and ranks candidates, and applies data, quote, policy and risk gates. It is the sole manual-candidate authorization point.", "The current feature service persists the decision, exports strategy_decision.json, then enqueues notifications. Persistence failure blocks READY. Optional explanatory context follows this boundary; multiple writes are not an atomic transaction."], "zh": ["04 · 候选授权与提交", "build_strategy_decision 组合事实与环境证据，构造和排序候选，执行数据、报价、策略和风险门控。它是唯一人工候选授权出口。", "现行特征服务先持久化决策，再导出 strategy_decision.json，随后入队通知。持久化失败阻止 READY；可选解释背景在此边界之后处理，多次写入不等于原子事务。"], "sources": ["src/spx_spark/application/order_map/strategy_select.py", "src/spx_spark/application/market_features/service.py", "src/spx_spark/infrastructure/operational_db.py"]}, {"en": ["05 · Python notifications and independent monitoring", "Python/Huey consumes notification work associated with event_id. Its queue database and the operational decision/notification database have different responsibilities. Enqueue acceptance is not a delivery receipt or an order.", "The existing Worker also owns scheduled maintenance and direct fault/recovery alerts. This monitoring path is independent of the Rust report-delivery path."], "zh": ["05 · Python 通知与独立监测", "Python/Huey 处理关联 event_id 的通知任务。队列数据库与运行决策/通知数据库职责不同；入队成功不等于送达回执，更不等于下单。", "既有 Worker 还负责定时维护及直接故障/恢复提醒，该监测路径独立于 Rust 报告投递。"], "sources": ["src/spx_spark/application/order_map/delivery.py", "src/spx_spark/infrastructure/jobs.py", "docs/notification-architecture.md"]}, {"en": ["06 · Desk Map and the Rust report lane", "Python Desk Map preparation reuses the committed strategy decision and rechecks current-time validity. The bridge consumes bounded normalized quote mirrors and desk_map_projection.v1; the complete Python strategy_decision does not cross it.", "Rust bridge, core, ledger, report and delivery retain typed readiness, scheduled/recovery reports, outbox state and per-target receipts. Rust neither opens broker sessions nor selects Python strategy legs. Reports do not grant new trade permission."], "zh": ["06 · Desk Map 与 Rust 报告路径", "Python Desk Map 复用已提交策略决策，并重验当前时间有效性。Bridge 消费有界标准报价镜像与 desk_map_projection.v1，不传递完整 Python strategy_decision。", "Rust bridge、core、ledger、report 和 delivery 保留类型化就绪判断、定时/恢复报告、outbox 和各目标回执；不连接券商，也不为 Python 策略选腿。报告不产生新交易权限。"], "sources": ["src/spx_spark/application/order_map/desk_projection_export.py", "contracts/README.md", "rust/docs/ARCHITECTURE.md", "docs/notification-architecture.md"]}, {"en": ["07 · Conditional research and model artifacts", "Stock/LEAPS scans, HMM context, scenario analysis and offline calibration have their own entry points and configuration gates. Shared data infrastructure is distinct from SPX candidate authorization.", "An available research artifact is not an automatically promoted model or proof of profitability. The historical atlas includes additional optional paths and a branch comparison; read its pinned revision and scope before interpreting them."], "zh": ["07 · 条件研究与模型产物", "股票/LEAPS 扫描、HMM 背景、情景分析与离线校准各有入口和配置门控。共享数据基础设施与 SPX 候选授权是不同职责。", "存在研究产物不等于模型自动推广，也不是盈利证明。历史 HTML 还包含其他可选路径和分支对照，应先核对固定版本与范围。"], "sources": ["module-architecture.md", "docs/monorepo-layout.md", "docs/architecture-simplification-execution-plan-v1.md"]}, {"en": ["08 · Archive, weekly replay and retention", "The Pi schedules incremental transfer of closed, verified Oracle quote partitions to NAS. NAS rereads hashes before publishing a snapshot. The laptop pins data, safe policy settings and a matching image, then runs isolated current-strategy replay.", "Reports, logs and lineage are verified on NAS after the run. Historical strategy cards and NO_TRADE records cannot select samples. Replay is counterfactual research; archive success does not introduce a new Oracle deletion policy."], "zh": ["08 · 归档、周回放与结果保存", "树莓派调度 Oracle 已关闭、已核验行情分区的增量传输；NAS 重读哈希后发布快照。笔记本固定数据、安全策略配置与同版本镜像，隔离回放当前策略。", "任务结束后在 NAS 核验报告、日志与来源清单。不能用历史策略卡或 NO_TRADE 记录筛选样本；回放是反事实研究，归档成功不新增 Oracle 删除规则。"], "sources": ["docs/architecture/README.md", "src/spx_spark/data_platform/lake/compact.py", "src/spx_spark/data_platform/replay_artifact.py"]}]</script>
<script>
'use strict';
const content=JSON.parse(document.getElementById('content').textContent);
const flows=JSON.parse(document.getElementById('flow-data').textContent);
let lang='en',view='system-overview',zoom=1;
const diagram=document.getElementById('diagram');
function showDiagram(){diagram.replaceChildren(document.getElementById(view+'-'+lang).content.cloneNode(true));diagram.querySelector('svg').style.width=zoom===1?'100%':(Math.max(diagram.clientWidth-40,720)*zoom)+'px';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}
function showFlows(){const host=document.getElementById('flows');host.replaceChildren();const query=document.getElementById('filter').value.toLowerCase();flows.forEach(f=>{if(![...f.en,...f.zh,...f.sources].join(' ').toLowerCase().includes(query))return;const d=document.createElement('details');const summary=document.createElement('summary');summary.textContent=f[lang==='en'?'en':'zh'][0];d.append(summary);const body=document.createElement('div');body.className='flow-body';f[lang==='en'?'en':'zh'].slice(1).forEach(text=>{const p=document.createElement('p');p.textContent=text;body.append(p);});const sources=document.createElement('div');sources.className='sources';const label=document.createElement('span');label.textContent=content[lang].sources+':';sources.append(label);f.sources.forEach(path=>{const a=document.createElement('a');a.textContent=path;a.href='https://github.com/hzy-hits/SpxOpDaily/blob/97a94f8220b65d498a18d421c2e4b4cd3ba581de/'+path;a.target='_blank';a.rel='noopener noreferrer';sources.append(a);});body.append(sources);d.append(body);host.append(d);});if(!host.children.length){const p=document.createElement('p');p.className='empty';p.textContent=content[lang].empty;host.append(p);}}
function setLanguage(value){lang=value;document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=content[lang][el.dataset.i18n]);document.getElementById('filter').placeholder=content[lang].searchPlaceholder;['en','zh-CN'].forEach(id=>document.getElementById(id).setAttribute('aria-pressed',String(id===lang)));showDiagram();showFlows();}
['en','zh-CN'].forEach(id=>document.getElementById(id).addEventListener('click',()=>setLanguage(id)));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;zoom=1;showDiagram();}));
document.getElementById('in').addEventListener('click',()=>{zoom=Math.min(3,zoom+0.25);showDiagram();});
document.getElementById('out').addEventListener('click',()=>{zoom=Math.max(1,zoom-0.25);showDiagram();});
document.getElementById('fit').addEventListener('click',()=>{zoom=1;showDiagram();});
document.getElementById('filter').addEventListener('input',showFlows);
setLanguage('en');
</script></body></html>
