# Oracle system-service overlay. It shares the isolated Rust shadow ledger and
# consumes only core's durable desk-map projection. The checked-in overlay is
# deliberately non-sending; production cutover must install a target-aligned
# runtime copy and enable both network gates in one controlled change.

projection_path = "/var/lib/spx-spark-core-shadow/latest/desk-map.json"
ledger_path = "/var/lib/spx-spark-core-shadow/ledger/operations.sqlite"
health_path = "/var/lib/spx-spark-report-shadow/health.json"
poll_interval_millis = 1000
slot_grace_seconds = 180
owner_lease_seconds = 180
source_max_bytes = 4194304
failure_backoff_seconds = [5, 15, 60, 300]
max_attempts = 3
targets = [
  { key = "shadow-audit", channel = "webhook" },
]

[writer]
network_enabled = false
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 64000
request_timeout_seconds = 90
