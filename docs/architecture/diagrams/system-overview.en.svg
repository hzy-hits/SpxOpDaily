<rect x="50" y="290" width="300" height="105" rx="12" fill="#eef4ff" stroke="#3664a1" stroke-width="1.4"/>
<text x="69" y="320" font-size="20" font-weight="700" class="">GitHub Actions</text>
<text x="69" y="349" font-size="17" font-weight="400" class="">Test and build AMD64 +</text>
<text x="69" y="372" font-size="17" font-weight="400" class="">ARM64</text>
</g>
<g data-card="Releases + GHCR">
<rect x="50" y="410" width="300" height="105" rx="12" fill="#eef4ff" stroke="#3664a1" stroke-width="1.4"/>
