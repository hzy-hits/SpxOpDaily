[project]
name = "spx-spark"
version = "0.1.0"
description = "Near-real-time SPX/SPXW data verifier and alert research system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "duckdb>=1.4,<2",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1",
  "huey>=2.6,<3",
  "ib-async>=2.0.0",
  "numpy>=2.0,<3",
  "openai>=2,<3",
  "pydantic-settings>=2.14.2",
  "pytz>=2025.2",
  "schwab-py==1.5.1",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "sqlalchemy>=2.0,<3",
  "structlog>=26.1.0",
  "typer>=0.27.1",
]

[project.scripts]
spx = "spx_spark.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.165.2",
  "import-linter>=2.13",
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.importlinter]
root_package = "spx_spark"

[[tool.importlinter.contracts]]
name = "domain and analytics stay pure"
type = "forbidden"
source_modules = ["spx_spark.domain", "spx_spark.analytics"]
forbidden_modules = [
  # TODO P2-1: add spx_spark.web after the real FastAPI package exists.
  "spx_spark.notifier",
  "spx_spark.infrastructure",
  "spx_spark.ibkr",
  "spx_spark.schwab",
  "spx_spark.application",
]

[[tool.importlinter.contracts]]
name = "layers for packaged code"
type = "layers"
layers = [
  # TODO P2-1: add spx_spark.web alongside spx_spark.cli once it exists.
  "spx_spark.cli",
  "spx_spark.application",
  "spx_spark.infrastructure",
  "spx_spark.analytics | spx_spark.domain",
]
ignore_imports = [
  # TODO P5-2: remove after the legacy maintenance entry moves into application.
  "spx_spark.infrastructure.jobs -> spx_spark.maintenance",
  # TODO P5-2: remove after legacy top-level session finalization moves into application.
  "spx_spark.infrastructure.jobs -> spx_spark.session_finalize",
  # TODO P4-2: replace this direct legacy notifier entry during notification cutover.
  "spx_spark.infrastructure.jobs -> spx_spark.application.schwab_reauth_reminder",
]
exhaustive = false
