server {
    listen 18084 default_server;
    server_name _;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The only intentionally public market-data artifact. The producer
    # atomically replaces this fixed file; no directory or JSON is exposed.
    location = /oi/latest.png {
        default_type image/png;
        alias /usr/share/nginx/data/oi/latest.png;
        limit_except GET HEAD { deny all; }
    }

    location = /strategy-risk/latest.png {
        default_type image/png;
        alias /usr/share/nginx/data/strategy-risk/latest.png;
        limit_except GET HEAD { deny all; }
    }

    location = /strategy-risk/gth-latest.png {
        default_type image/png;
        alias /usr/share/nginx/data/strategy-risk/gth-latest.png;
        limit_except GET HEAD { deny all; }
    }

    location = / {
        return 410;
    }

    location = /live {
        return 410;
    }

    location = /live/ {
        return 410;
    }

    location = /replay {
        return 410;
    }

    location = /replay/ {
        return 410;
    }

    location = /sessions {
        return 410;
    }

    location = /friday {
        return 410;
    }

    location / {
        return 404;
    }
}
