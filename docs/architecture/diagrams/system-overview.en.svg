<text x="40" y="579" font-size="17" font-weight="700" class="">HANDOFFS · data and artifacts</text>
<text x="48" y="616" font-size="19" font-weight="600" class="">1  Release bundle  →  Oracle</text>
<text x="655" y="616" font-size="17" font-weight="400" class="muted">ARM64 / systemd</text>
<text x="48" y="659" font-size="19" font-weight="600" class="">2  Matching image  →  Linux laptop</text>
<text x="655" y="659" font-size="17" font-weight="400" class="muted">AMD64 / isolated replay</text>
<text x="48" y="702" font-size="19" font-weight="600" class="">3  Oracle quotes  →  Pi  →  NAS</text>
<text x="655" y="702" font-size="17" font-weight="400" class="muted">Read-only archive + NAS verification</text>
<text x="48" y="745" font-size="19" font-weight="600" class="">4  NAS snapshot  →  laptop  →  NAS</text>
<text x="655" y="745" font-size="17" font-weight="400" class="muted">Research inputs + result receipts</text>
<text x="40" y="807" font-size="17" font-weight="400" class="muted">Mac: review, operations and on-demand research. No scheduled compute role.</text>
</svg>
