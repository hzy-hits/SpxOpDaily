[workspace]
members = [
    "crates/spx-core",
    "crates/spx-delivery",
    "crates/spx-domain",
    "crates/spx-ledger",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "=0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1.24.0", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
